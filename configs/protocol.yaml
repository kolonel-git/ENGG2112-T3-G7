# Single source of truth for every experiment. Do not hard-code these values elsewhere.
# Undecided values stay TODO. Every decision is logged in docs/project/DECISIONS.md (IDs in comments).

dataset:
  name: Hill of Towie
  version: "2.1.0"            # Zenodo record 22662930; version still to be confirmed (see DECISIONS.md D-004)
  zenodo_record: 22662930
  doi: "10.5281/zenodo.22662930"
  tables: [tblSCTurTemp, tblSCTurbine, tblSCTurPress, tblAlarmLog, tblDailySummary]  # D-004
  wanted_not_in_raw: [tblSCTurGrid, tblSCTurFlag]  # active power and error time; proxies used, D-018

# Cleaning rules for the raw SCADA tables (D-013 to D-016). Sentinels are masked to NaN per table;
# 200 in yaw/nacelle position and PowerRef are real values and are NOT masked (checked in the data).
cleaning:
  expected_turbines: 21
  outage_coverage_threshold: 0.9      # months below this share of the full 10-min grid are flagged
  producing_min_rpm: 1000             # "producing" rows for the wind-sensor check
  suspect_wind_min_corr: 0.55         # corr(wind speed, generator rpm) below this is flagged per turbine-year
  suspect_wind_min_rows: 1000
  mask_sentinels:
    tblSCTurTemp: [200.0, -50.0]
    tblSCTurPress: [-100.0, 200.0]
    tblSCTurbine: []
  daily:                              # tblDailySummary flags
    min_samples: 90
    expected_period_minutes: 1440
    max_hours: 24.01

# Time-based split on raw SCADA years (D-006). 2019 has no temperature/pressure tables, so it
# is unused. Model fitting, thresholds and normal-behaviour models use train years only.
splits:
  train_years: [2016, 2017, 2018, 2020]
  val_years: [2021, 2022]
  test_years: [2023, 2024, 2025, 2026]   # 2026 ends 2026-04-30

robustness:
  leave_one_turbine_out: false  # main runs use the time split; O3 scripts run leave-one-turbine-out (D-006)
  # Sensor groups for the dropout test (D-062): at scoring time every feature built from a sensor in
  # the group (daily mean or maximum, 7-day window mean or std) is set to missing; the fitted model
  # is not changed. `state` adds the wind, rpm and operating-state summary columns to the group.
  sensor_groups:
    pressure:
      tokens: [HubPresA, HubPresB, HubPresC, HydPress, BrakPres, GearPres, InlPrAft, InlPrBef, OfflPres, InvPress, BrAccPrs, BoostAct, BoostAva]
    drivetrain_temperature:
      tokens: [GeOilTmp, GenBeGTm, GenBeRTm, MainBTmp, HSGenTmp, HSRotTmp, IMSGenTm, IMSRotTm, TraOilTF, TraRooTF, Gen1U1Tm, Gen1V1Tm, Gen1W1Tm, GenAvgTm, HydOilTm]
    power_electronics:
      tokens: [ConvWTmp, ReacUTmp, ReacVTmp, ReacWTmp, GFilB1Tm, GFilB2Tm, GFilB3Tm, InvUpTmp, TrafoTMa, BrkTmpGn]
    wind_rpm:
      tokens: [PrWindSp, SeWindSp, AcWindSp, GenRpm, MainSRpm]
      state: true

labels:
  # In-scope alarm codes and tiers (D-001, D-002). Superseded by D-003: alarm codes are now
  # FEATURES (counts per window), not targets. All other codes are dropped.
  alarm_codes:
    - {code: 3130,  tier: 1, stopping: true,  description: "Pitch lubrication"}
    - {code: 10105, tier: 1, stopping: true,  description: "Stopped, untwisting cables"}
    - {code: 1005,  tier: 2, stopping: true,  description: "Availability - low wind"}
    - {code: 8000,  tier: 2, stopping: true,  description: "Windspeed too high to operate"}
    - {code: 8210,  tier: 2, stopping: true,  description: "Stopped, due to icing"}
    - {code: 8230,  tier: 2, stopping: true,  description: "Ice detection: Low torque"}
    - {code: 8234,  tier: 2, stopping: true,  description: "Ice detection: No cut in"}
    - {code: 8235,  tier: 2, stopping: true,  description: "Ice Detect: Stopped"}
    - {code: 8236,  tier: 2, stopping: true,  description: "Ice Detect: Stopped, De-Ice"}
    - {code: 20,    tier: 3, stopping: false, description: "Large generator cut-in"}
    - {code: 25,    tier: 3, stopping: false, description: "Fast cut-out of generator"}
    - {code: 102,   tier: 3, stopping: false, description: "Ice detection"}
  feature_tiers: [1, 2, 3]            # D-003
  keep_other_alarms_for_masking: false  # D-003: healthy-row mask uses fault-time labels instead

  # O2 targets (D-003, D-005). Prediction time t is the end of a turbine-day.
  # label = 1 if a fault episode starts in (t, t + positive_window_days];
  # rows with an episode start in (t + positive_window_days, t + exclusion_end_days] are dropped.
  targets:
    daily_fault_time:                 # target A: tblDailySummary.TimeErr (D-007)
      fault_day_min_hours: 4
      episode_gap_days: 7             # fault-free days that separate two episodes
    scada_stops:                      # target B: stops derived from 10-min SCADA (D-008)
      stop_max_rpm: 200
      stop_min_wind_ms: 4.0
      stop_min_intervals: 18          # 3 hours of consecutive 10-min intervals
      min_observed_intervals_per_day: 115   # a day counts as observed with >= 115 of 144 intervals (D-019)
      episode_gap_days: 7
  positive_window_days: 30            # D-005 (project brief)
  exclusion_end_days: 60              # D-005: (30, 60] days before an episode is excluded
  feature_window_days: 7              # D-005 (project brief)
  min_horizon_coverage: 0.8           # D-019: share of the next 60 days that must be observed for a negative label

evaluation:
  false_alarm_budget_per_turbine_month: 1   # D-009 (project brief)
  days_per_month: 30.4375                   # D-020: converts scored turbine-days to turbine-months
  bootstrap_resamples: 1000                 # D-020: resamples of turbines for confidence intervals
  ci_level: 0.95                            # D-020: percentile interval
  # false alarm = alert on a turbine-day whose label is 0; recall and lead time are event-level.

features:                             # D-021: provisional choices, not tuned
  min_producing_intervals: 12         # a sensor's daily mean needs at least this many producing 10-min intervals (2 hours)
  window_min_days: 4                  # a 7-day window statistic needs at least this many observed days

# H0 healthy fitting rows (D-030). Scope is the requested 2016 to 2025 data; the configured
# train years still control eligibility, so validation and test days never qualify.
healthy:
  start_year: 2016
  end_year: 2025
  recovery_days: 7                    # exclude seven days after an episode ends
  cut_in_wind_ms: 4.0                 # operating proxy aligned with stop_min_wind_ms, not a verified manufacturer cut-in

preprocessing_p0:                     # D-040: learned on labelled train rows only
  min_observed_share: 0.5             # inclusive finite-value share needed to keep a column
  add_missing_indicators: false       # primary linear baseline does not encode sensor availability
  scale: true                         # train mean and population standard deviation
  clip_quantiles: null                # no clipping in the primary baseline

baseline_b4:                          # D-041, D-042
  c_grid: [0.01, 0.1, 1.0]
  selected_c:                         # filled only after validation tuning; test remains untouched
    a: 0.01                           # validation tuning, 2026-10-23 (D-041)
    b: 0.01
  selection_metric: pr_auc
  selection_tie_break: smallest_c
  solver: liblinear
  max_iter: 2000
  tolerance: 0.0001
  nonfinite_score_fallback: 0.5
  coefficient_top_n: 20

b1_recent_fault:                     # D-050: fixed rules, not tuned on validation
  tie_weight: 0.5                    # bounded recency cannot overturn a one-day count gap
  missing_count: 0.0                 # no known history gives the lowest count contribution

b2_alarm_count:
  selected_variant: {a: tier1_2, b: code_10105}
  candidates: [total, tier2, tier1_2, code_3130, code_10105, code_1005, code_8000, code_8210, code_8230, code_8234, code_8235, code_8236, code_20, code_25, code_102]
  window_days: 7
  missing_count: 0.0
r1_zscore:
  sensors: [wtc_GeOilTmp_mean, wtc_GenBeGTm_mean, wtc_GenBeRTm_mean, wtc_MainBTmp_mean, wtc_Gen1U1Tm_mean, wtc_Gen1V1Tm_mean, wtc_Gen1W1Tm_mean]
  window_days: 7
  minimum_healthy_rows: 30
  minimum_std: 0.000001
  missing_score: 0.0

baseline_table:
  exclude_stations: [2304515]

# B3 provisional physical-proxy settings; not tuned on validation or test (D-031).
power_curve:
  bin_width_ms: 0.5
  wind_min_ms: 4.0
  wind_max_ms: 25.0
  min_bin_intervals: 30
  tolerance_std_multiple: 2.0

# Normal-behaviour models for O1 (D-057). Provisional choices, not tuned on validation or test.
nbm:
  inputs: [op_wtc_PrWindSp_mean, op_wtc_GenRpm_mean, op_wtc_MainSRpm_mean, op_wtc_AmbieTmp_mean, op_wtc_NacelTmp_mean]
  targets: [op_wtc_GeOilTmp_mean, op_wtc_GenBeGTm_mean, op_wtc_GenBeRTm_mean, op_wtc_MainBTmp_mean, op_wtc_Gen1U1Tm_mean, op_wtc_Gen1V1Tm_mean, op_wtc_Gen1W1Tm_mean, op_wtc_TraOilTF_mean, op_wtc_HydOilTm_mean, op_wtc_IMSGenTm_mean]
  ridge_alpha: 1.0
  smoothing_days: 7                   # trailing window for the smoothed residual
  fleet_relative: true                # subtract the day's fleet median residual; chosen on validation (D-055)
  fleet_min_turbines: 5               # turbines needed on a day for a fleet median
  indicator_missing_score: 0.0        # R2 score for a day with no indicator (D-058)
  minimum_fit_rows: 200               # healthy rows needed to fit one target
  minimum_turbine_rows: 100           # healthy rows needed for a turbine's own residual spread
  minimum_std: 0.000001

# Class-weighted LightGBM (D-056). `selected` is frozen by D-060 after scripts/tune_lgbm.py chose
# it on validation; the grid is the whole search and is not widened.
lgbm:
  selected:
    a: {num_leaves: 7, n_estimators: 300, learning_rate: 0.05, min_child_samples: 200}
    b: {num_leaves: 31, n_estimators: 300, learning_rate: 0.05, min_child_samples: 200}
  grid:
    num_leaves: [7, 15, 31]
    n_estimators: [100, 300]
    learning_rate: [0.05]
    min_child_samples: [200]
  subsample: 0.8
  colsample_bytree: 0.5
  reg_lambda: 1.0
  selection_metric: pr_auc
  selection_tie_break: simplest        # fewest leaves, then fewest trees
  nonfinite_score_fallback: 0.5
  importance_top_n: 20

# SHAP and its stability across leave-one-turbine-out folds (D-062); validation rows only.
explain:
  shap_sample_rows: 4000              # labelled validation rows explained for the full model
  stability_sample_rows: 1000         # rows explained per leave-one-turbine-out fold
  top_n: 20

# Exploratory validation-only runs (D-064): drift-robust features and low-capacity models. Not part
# of the frozen results; the test years are never scored here.
exploratory:
  min_turbines: 5                     # turbines needed on a day for a fleet median
  feature_sets: [raw, fleet, fleet_season]
  shallow_trees:                      # LightGBM with very small trees, all settings are run
    num_leaves: 3
    max_depth: 2
    learning_rate: 0.05
    min_child_samples: 500
    n_estimators: [50, 150]
  sparse_logistic:                    # L1-penalised logistic regression, all values are run
    c_grid: [0.003, 0.01, 0.03]
  year_shift:                         # train years only: fit on years up to fit_up_to, score score_year
    fit_up_to: 2018
    score_year: 2020
  resamples: 200                      # bootstrap resamples (exploratory; the frozen runs use 1,000)

# Second exploratory round (D-065): rolling self-baseline features and a turbine-ranking metric.
# Validation years only; the test years are never scored here.
exploratory_round2:
  feature_sets: [self, self_fleet]
  window_days: 90                     # trailing window of a turbine's own feature values
  min_days: 30                        # observed days needed in the window
  ranking:
    top_k: [3, 5]                     # turbines flagged each day out of those with a label that day
    min_turbines: 10                  # days with fewer labelled turbines are skipped
    resamples: 1000                   # bootstrap over calendar months

# Third exploratory round (D-066): rank the features and prune the least useful. Selection
# uses labelled train rows only; validation years are scored, the test years never.
exploratory_round3:
  feature_sets: [raw, self_fleet]
  methods: [gain_cv, year_stable_auc, gain_cv_decorr]
  keep: [10, 25, 50, 100]             # columns kept after ranking, every value is run
  decorrelate_above: 0.9              # gain_cv_decorr: skip a column this correlated (abs Spearman) with a kept one
  rank_sample_rows: 20000             # rows per fit used for the correlation matrix
  models: [lgbm_frozen, b4_logistic]
  drop_groups: [pressure, drivetrain_temperature, power_electronics, wind_rpm, alarms, fault_history, day_state]

# Label sensitivity round (D-068): rebuild the labels with other horizons, severities and a
# fault-only version of target B, and rerun the frozen models on the validation years. Labels
# are built in memory; the frozen label files are not touched. The test years are never scored.
label_sensitivity:
  horizons: [7, 14, 30]               # positive window in days; the exclusion zone ends at 2 x the window
  a_fault_hours: [4, 8, 12]           # target A: TimeErr hours that make a fault day (reference: 4)
  b_stop_intervals: [18, 36, 72]      # target B: consecutive 10-min stop intervals that make a stop (reference: 18)
  b_weather_stops: [keep, drop]       # drop: remove stop runs that start with a weather alarm active (tier below)
  weather_tiers: [2]                  # alarm tier 2 = low wind, high wind and icing codes in `alarm_codes`
  weather_margin_intervals: 1         # an alarm counts if it is active from this many 10-min intervals before the stop
  models: [B1_recent_fault, B2_alarm_count, R1_zscore, B3_power_curve, B4_logistic, R2_nbm_indicator, L1_lgbm]
  resamples: 500                      # turbine bootstrap resamples (exploratory; the frozen runs use 1,000)
  ranking_top_k: 3                    # daily top-k turbines for the ranking metric (D-065)

seed: 42                              # D-010

# D-054: descriptive validation sensitivity, not a replacement for the official budget.
budget_analysis:
  budgets: [0.05, 0.1, 0.25, 0.5, 0.75, 1.0, 1.5, 2.0]
